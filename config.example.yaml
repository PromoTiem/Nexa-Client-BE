# Application
app_name: Nexa-Client-BE
app_env: development
app_debug: true
app_host: "0.0.0.0"
app_port: 8002

# PocketBase (IDP)
pocketbase_url: ""
pocketbase_auth_collection: "users"
pocketbase_admin_email: ""  # PocketBase admin email for migrations
pocketbase_admin_password: ""  # PocketBase admin password for migrations
pocketbase_timeout: 10.0
pocketbase_max_retries: 3
pocketbase_retry_backoff: 0.5

# CORS
allowed_origins: "http://localhost:3000"

# Build
builders_repo_url: "https://github.com/PromoTiem/Nexa-Builders"
github_token: ""

# Site deployment
site_base_domain: "promotiem.shop"

# Telegram
telegram_bot_token: ""
telegram_chat_id: ""
telegram_thread_id: ""
telegram_enabled: false

# Cloudflare
cloudflare_api_token: ""
cloudflare_account_id: ""
cloudflare_zone_id: ""
cloudflare_timeout: 30.0
cloudflare_max_retries: 3
cloudflare_retry_backoff: 1.0

# Logging
logging:
  level: INFO
  loki_enabled: false
  loki_url: "http://localhost:3100/loki/api/v1/push"
  loki_labels: {}

# Storage (RustFS / S3)
storage:
  endpoint_url: "http://localhost:9000"
  public_endpoint_url: "http://localhost:9000"
  access_key: ""
  secret_key: ""
  region: "us-east-1"
  presign_expiry_seconds: 900
  max_file_bytes: 10485760

# MoMo Payment Gateway (Sandbox)
momo:
  enabled: false
  partner_code: ""
  access_key: ""
  secret_key: ""
  public_key: ""
  endpoint: "https://test-payment.momo.vn/v2/gateway/api/create"
  query_endpoint: "https://test-payment.momo.vn/v2/gateway/api/query"
  ipn_url: ""
  redirect_url: ""
  order_expire_minutes: 15

# Public ecommerce checkout pricing.
# The server is the authority for the amount charged; client prices are ignored.
# These values mirror Nexa-FE's ecommerceCatalogue.ts until the live catalogue
# API exists. Override here or via ECOMMERCE__PRICES / ECOMMERCE__SHIPPING_FEE.
ecommerce:
  prices:
    p-ly-gom: 320000
    p-den-may: 680000
    p-khay-go: 250000
    p-binh-hoa: 390000
    p-tham-len: 1250000
    p-nen-thom: 180000
    p-gio-may: 220000
    p-coc-su: 150000
  free_shipping_threshold: 500000
  shipping_fee: 30000

# Use a shared Redis URI in production so limits apply across all workers.
rate_limit_storage_uri: "redis://redis:6379/0"
