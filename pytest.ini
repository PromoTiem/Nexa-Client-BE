[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --strict-markers --timeout=60 --junitxml=reports/junit.xml --cov=app --cov-report=xml --cov-report=term-missing
markers =
    storage: marks tests that call RustFS/S3 storage directly
    live: marks tests that call live external APIs (Cloudflare, PocketBase)
    flaky: marks tests that are known to be flaky and should be quarantined
    e2e: marks end-to-end pipeline tests (create -> build -> serve -> deploy)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
