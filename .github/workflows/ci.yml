name: CI Test Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: "Run slow/integration tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
  POCKETBASE_API_TOKEN: ${{ secrets.POCKETBASE_API_TOKEN }}
  TEST_IDENTITY: ${{ secrets.TEST_IDENTITY }}
  TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
  RUSTFS_ENDPOINT: ${{ secrets.RUSTFS_ENDPOINT }}
  RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
  RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff linter
        run: ruff check app/ tests/

      - name: Run ruff format check
        run: ruff format --check app/ tests/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/unit \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=reports/junit-unit.xml \
            --timeout=60 \
            --strict-markers \
            -m "not storage and not live and not e2e" \
            -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: reports/junit-unit.xml
          retention-days: 30

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          retention-days: 30

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      inputs.run_slow_tests == true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          python -m pytest tests/integration \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=reports/junit-integration.xml \
            --timeout=120 \
            --strict-markers \
            -m "not storage and not e2e" \
            -v || echo "Integration tests may have skipped due to missing credentials"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: reports/junit-integration.xml
          retention-days: 30

          - name: Upload coverage shard
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: coverage-unit
              path: coverage.xml
              retention-days: 1

  test-storage:
    name: Storage Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run storage tests
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=reports/junit-storage.xml \
            --timeout=60 \
            -m "storage" \
            -v || echo "Storage tests skipped (no credentials)"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-storage
          path: reports/junit-storage.xml
          retention-days: 30

  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run e2e tests
        run: |
          python -m pytest tests/integration \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=reports/junit-e2e.xml \
            --timeout=120 \
            -m "e2e" \
            -v || echo "E2E tests skipped (no credentials)"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: reports/junit-e2e.xml
          retention-days: 30

  coverage-report:
    name: Coverage Report
    needs: [test-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate coverage report
        run: |
          python -m pytest tests/unit \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --strict-markers \
            -m "not storage and not live and not e2e" \
            -q

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  publish-reports:
    name: Publish Test Reports
    needs: [test-unit, test-integration, test-e2e, test-storage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      checks: write
      contents: read
    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: test-reports

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-reports/**/*.xml"
          comment_mode: off

    notify-failure:
    name: Notify on Failure
    needs: [test-unit, test-integration, test-e2e, test-storage, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: failure() && github.event_name == 'push'
    steps:
      - name: Send failure notification
        run: |
          echo "CI pipeline failed for ${{ github.repository }} on ${{ github.ref }}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
