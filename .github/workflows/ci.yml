name: CI Test Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# External acceptance requires disposable infrastructure, tracked in #37.
# Never expose service credentials to automatic source-validation jobs.
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run isolated unit tests
        run: >-
          python -m pytest tests/unit -q --strict-markers
          -m "not storage and not live and not e2e"
          --junitxml=reports/junit-unit.xml
          --cov=app --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-evidence
          path: reports/
          retention-days: 30
